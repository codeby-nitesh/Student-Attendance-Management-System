<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Attendance Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3">
        <i class="fas fa-graduation-cap fa-2x"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Apex Attendance System</h4>
      <p class="text-muted small mb-0">Sign in to your institutional account</p>
    </div>

    <div class="login-body-content">
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show small d-flex align-items-center gap-2 mb-3" role="alert">
              <i class="fas {% if category == 'danger' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
              <div>{{ message }}</div>
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" placeholder="Enter username" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="Enter password" required>
            <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePasswordBtn">
              <i class="far fa-eye" id="passwordEyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-4">
          <i class="fas fa-sign-in-alt me-2"></i>Sign In
        </button>
      </form>

      <!-- Quick Demo Credentials Box -->
      <div class="p-3 bg-light rounded-3 border">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="small fw-bold text-dark"><i class="fas fa-key text-warning me-1"></i>Quick Demo Accounts</span>
          <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.65rem;">Click to fill</span>
        </div>
        <div class="d-flex flex-column gap-2">
          <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center py-1" onclick="fillCredentials('admin', 'Admin@123')">
            <span><strong>Admin:</strong> admin</span>
            <small class="badge bg-primary text-white">Admin</small>
          </button>
          <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center py-1" onclick="fillCredentials('teacher', 'Teacher@123')">
            <span><strong>Teacher:</strong> teacher</span>
            <small class="badge bg-success text-white">Teacher</small>
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center py-1" onclick="fillCredentials('staff', 'Staff@123')">
            <span><strong>Staff:</strong> staff</span>
            <small class="badge bg-secondary text-white">Attendance</small>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    toggleBtn.addEventListener('click', function () {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    // Quick demo fill
    function fillCredentials(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>
