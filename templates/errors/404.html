{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="card p-5 text-center max-w-600 mx-auto my-5">
  <div class="text-secondary mb-3">
    <i class="fas fa-search-minus fa-4x"></i>
  </div>
  <h2 class="fw-bold">404 - Page Not Found</h2>
  <p class="text-muted">The requested page, record, or resource could not be found in the system.</p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4"><i class="fas fa-home me-1"></i>Return to Dashboard</a>
  </div>
</div>
{% endblock %}
