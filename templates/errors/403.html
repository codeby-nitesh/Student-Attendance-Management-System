{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="card p-5 text-center max-w-600 mx-auto my-5">
  <div class="text-danger mb-3">
    <i class="fas fa-ban fa-4x"></i>
  </div>
  <h2 class="fw-bold">403 - Access Forbidden</h2>
  <p class="text-muted">You do not have administrative clearance to access this resource or execute this operation.</p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4"><i class="fas fa-home me-1"></i>Return to Dashboard</a>
  </div>
</div>
{% endblock %}
